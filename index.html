<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f5f2">
<title>Along · AI Fashion Studio</title>
<style>
:root{--bg:#f7f5f2;--ink:#292624;--muted:#817b74;--line:#e9e5df;--accent:#1f5c4d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:68px;flex:0 0 68px;padding:0 26px;display:flex;align-items:center;gap:24px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:11px;min-width:0;white-space:nowrap}
.logo{height:36px;width:36px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800}
.brand-name{font-weight:800;font-size:14px;letter-spacing:.08em}
.brand-sub{font-size:10px;color:var(--muted);margin-top:1px}
.selector{display:inline-flex;gap:3px;margin-left:auto;padding:3px;background:#f1efeb;border:1px solid var(--line);border-radius:9px;flex:none}
.tab{min-width:94px;border:0;background:transparent;color:#706a63;border-radius:6px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;transition:background .16s,color .16s,box-shadow .16s;white-space:nowrap}
.tab.active{background:var(--accent);color:#fff;box-shadow:0 1px 4px #1f5c4d2b}
.tab .en{font-size:9px;font-weight:500;opacity:.75;margin-left:4px}
.frame-wrap{flex:1;min-height:0;padding:0 14px 14px}
#appFrame{display:block;width:100%;height:calc(100vh - 82px);min-height:580px;border:1px solid var(--line);border-radius:0 0 10px 10px;background:#fff}
@media(max-width:650px){
 .topbar{height:58px;flex-basis:58px;padding:0 12px;gap:10px}
 .logo{height:32px;width:32px;border-radius:9px}
 .brand-name{font-size:11px;letter-spacing:.04em}
 .brand-sub{font-size:9px}
 .selector{gap:2px;padding:2px}
 .tab{min-width:0;padding:8px 11px;font-size:11.5px}
 .tab .en{display:none}
 .frame-wrap{padding:0 6px 6px}
 #appFrame{height:calc(100vh - 64px);min-height:560px}
}
@media(max-width:390px){.brand-sub{display:none}.brand-name{font-size:10px}.topbar{gap:7px}.tab{padding:8px 9px}}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand"><div class="logo">A</div><div><div class="brand-name">ALONG / FASHION STUDIO</div><div class="brand-sub">AI 商品图提示词工作台</div></div></div>
 <nav class="selector" role="tablist" aria-label="服装分类">
  <button class="tab active" id="menTab" role="tab" aria-selected="true" aria-controls="appFrame" data-src="./generated-images.html">男装 <span class="en">MEN</span></button>
  <button class="tab" id="womenTab" role="tab" aria-selected="false" aria-controls="appFrame" data-src="./generated-images-women.html">女装 <span class="en">WOMEN</span></button>
 </nav>
</header>
<main class="frame-wrap">
 <iframe id="appFrame" title="Along 男装 AI 提示词工作台" src="./generated-images.html"></iframe>
</main>
<script>
const frame=document.getElementById("appFrame");
const tabs=[document.getElementById("menTab"),document.getElementById("womenTab")];
function switchCategory(tab){
 const next=tab.dataset.src;
 if(frame.getAttribute("src")!==next) frame.setAttribute("src",next);
 tabs.forEach(item=>{
  const active=item===tab;
  item.classList.toggle("active",active);
  item.setAttribute("aria-selected",String(active));
 });
 frame.title=tab===tabs[0]?"Along 男装 AI 提示词工作台":"Along 女装 AI 提示词工作台";
}
tabs.forEach(tab=>tab.addEventListener("click",()=>switchCategory(tab)));
</script>
</body>
</html>
