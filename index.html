<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f5f2">
<title>Along · AI Fashion Studio</title>
<style>
:root{--bg:#f7f5f2;--ink:#292624;--muted:#817b74;--line:#e9e5df;--accent:#a65c72;--accent-soft:#f5e8ec;--dark:#292624}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:68px;flex:0 0 68px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:11px;min-width:0}.logo{height:36px;width:36px;border-radius:11px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:800}.brand-name{font-weight:800;font-size:14px;letter-spacing:.08em}.brand-sub{font-size:10px;color:var(--muted);margin-top:1px}
.top-note{font-size:11px;color:var(--muted)}
.selector-wrap{padding:17px 24px 14px;background:var(--bg);display:flex;justify-content:center}
.selector{display:inline-flex;gap:5px;padding:5px;background:#ebe7e2;border:1px solid #e5e0d9;border-radius:13px}
.tab{min-width:132px;border:0;background:transparent;color:#706a63;border-radius:9px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;transition:background .18s,color .18s,box-shadow .18s}
.tab.active{background:#fff;color:var(--accent);box-shadow:0 2px 8px #34281b12}
.tab .en{font-size:10px;font-weight:500;opacity:.7;margin-left:5px}
.frame-wrap{flex:1;min-height:0;padding:0 14px 14px}
#appFrame{display:block;width:100%;height:calc(100vh - 132px);min-height:620px;border:1px solid var(--line);border-radius:13px;background:#fff}
@media(max-width:650px){.topbar{height:58px;flex-basis:58px;padding:0 14px}.top-note{display:none}.selector-wrap{padding:12px 10px}.tab{min-width:0;padding:9px 18px}.frame-wrap{padding:0 7px 7px}#appFrame{height:calc(100vh - 115px);min-height:580px;border-radius:9px}}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand"><div class="logo">A</div><div><div class="brand-name">ALONG / FASHION STUDIO</div><div class="brand-sub">AI 商品图提示词工作台</div></div></div>
 <div class="top-note">同一工作台 · 男女装分类切换</div>
</header>
<nav class="selector-wrap" aria-label="选择服装分类">
 <div class="selector" role="tablist" aria-label="男女装">
  <button class="tab active" id="menTab" role="tab" aria-selected="true" aria-controls="appFrame" data-src="./generated-images.html">男装 <span class="en">MEN</span></button>
  <button class="tab" id="womenTab" role="tab" aria-selected="false" aria-controls="appFrame" data-src="./generated-images-women.html">女装 <span class="en">WOMEN</span></button>
 </div>
</nav>
<main class="frame-wrap">
 <iframe id="appFrame" title="Along 男装 AI 提示词工作台" src="./generated-images.html"></iframe>
</main>
<script>
const frame=document.getElementById("appFrame");
const tabs=[document.getElementById("menTab"),document.getElementById("womenTab")];
function switchCategory(tab){
 const next=tab.dataset.src;
 if(frame.getAttribute("src")!==next) frame.setAttribute("src",next);
 tabs.forEach(item=>{
  const active=item===tab;
  item.classList.toggle("active",active);
  item.setAttribute("aria-selected",String(active));
 });
 frame.title=tab===tabs[0]?"Along 男装 AI 提示词工作台":"Along 女装 AI 提示词工作台";
}
tabs.forEach(tab=>tab.addEventListener("click",()=>switchCategory(tab)));
</script>
</body>
</html>
